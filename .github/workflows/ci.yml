name: Vendor assurance evaluation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m vendor_assurance examples/synthetic.json --tenant synthetic-bank --as-of 2026-09-08 --decision examples/human-decision.json --output /tmp/vendor-assurance-demo
      - run: python -m vendor_assurance.remediation examples/remediation.json --tenant synthetic-bank --as-of 2026-09-08T13:00:00Z --decision examples/closure-reviewer.json --output /tmp/remediation-demo
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-client libpq-dev
      - run: python -m pip install .
      - run: A2Z_RECOVERY_INTEGRATION=1 python -m unittest discover -s tests -v
      - run: python -m vendor_assurance.recovery --output output/recovery-ci
